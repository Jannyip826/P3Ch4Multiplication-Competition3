<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>雙人乘法拔河賽</title>
<style>
:root{--ink:#203047;--muted:#718096;--paper:#fffdf8;--line:#d9e2ec;--a:#ef6c57;--a-dark:#c94b3d;--b:#3d82dc;--b-dark:#2563ad;--gold:#f5b841;--green:#25a269;--danger:#d84242;--shadow:0 14px 34px rgba(55,72,95,.13)}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7e7 0%,#eef8ff 100%);user-select:none}
button,input{font:inherit}.app{width:min(1500px,100%);margin:auto;padding:20px 18px 26px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;gap:13px;align-items:center}.brand-mark{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#ffd166,#f59e0b);display:grid;place-items:center;font-size:33px;box-shadow:0 8px 18px #e9b94d66}.brand h1{font-size:clamp(1.35rem,2.7vw,2.25rem);margin:0;font-weight:900;letter-spacing:.04em}.brand p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:.92rem}.top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.level-select{background:#fff;border:1px solid #d9e2ec;border-radius:12px;padding:10px 12px;color:var(--ink);font-weight:900;outline:none;cursor:pointer}.level-select:focus{border-color:var(--gold);box-shadow:0 0 0 4px #f5b84133}.pill{background:#ffffffc9;border:1px solid #ffffff;padding:9px 14px;border-radius:999px;font-weight:800;color:#67758a}.restart{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;box-shadow:0 5px 12px #20304726}.restart:hover{background:#344962;transform:translateY(-1px)}
.game-layout{display:grid;grid-template-columns:minmax(250px,1fr) minmax(330px,1.35fr) minmax(250px,1fr);gap:16px;align-items:stretch}.team-card,.arena{background:#ffffffd9;border:1px solid #fff;border-radius:25px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.team-card{padding:16px;display:flex;flex-direction:column;min-width:0}.team-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:2px dashed var(--line)}.team-name{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.25rem}.team-dot{width:15px;height:15px;border-radius:50%;background:var(--a);box-shadow:0 0 0 5px #ef6c5720}.team-b .team-dot{background:var(--b);box-shadow:0 0 0 5px #3d82dc20}.score{font-size:1.25rem;font-weight:900}.score small{font-size:.75rem;color:var(--muted);font-weight:800}.roundline{display:flex;justify-content:space-between;align-items:center;margin:12px 1px 9px;color:var(--muted);font-size:.82rem;font-weight:800}.progress{height:9px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),#ffb46b);border-radius:inherit;transition:width .35s ease}.team-b .progress span{background:linear-gradient(90deg,#74b8ff,var(--b))}.problem-card{background:var(--paper);border:1px solid #f2e7cf;border-radius:18px;padding:13px 11px 15px;min-height:276px;display:flex;flex-direction:column;align-items:center;justify-content:center}.problem-label{align-self:stretch;display:flex;justify-content:space-between;color:#9a7c49;font-size:.73rem;font-weight:900;margin-bottom:9px}.vertical{min-width:190px;display:flex;flex-direction:column;align-items:flex-end}.carry-row,.number-row,.answer-row{display:grid;grid-template-columns:repeat(4,42px);gap:4px;justify-content:end}.carry-row{min-height:28px}.line-wrap{position:relative;height:34px;margin:7px 0;width:100%}.line-wrap .bar{position:absolute;left:0;top:12px;margin:0}.line-wrap .carry-row{position:absolute;left:0;top:0;z-index:2;min-height:25px}.carry,.digit{display:grid;place-items:center;text-align:center;appearance:none;-webkit-appearance:none;cursor:pointer}.carry{width:31px;height:25px;border-radius:50%;font-size:.82rem;font-weight:900;color:#a07118;background:#fff0be;border:2px solid #edc758;outline:none;padding:0;text-align:center}.digit{padding:0 4px}.num{width:42px;text-align:center;font-size:2rem;font-weight:900;line-height:1.1}.operator{width:42px;text-align:center;font-size:1.85rem;font-weight:900;color:#9a7c49}.bar{height:4px;background:var(--ink);border-radius:99px;width:100%;margin:7px 0}.digit{width:42px;height:49px;border:2px solid #ccd6e1;border-radius:10px;background:#fff;color:var(--ink);font-size:1.55rem;font-weight:900;outline:none;transition:.16s}.digit:focus,.carry:focus{border-color:var(--gold);box-shadow:0 0 0 4px #f5b84133}.digit.correct,.carry.correct{border-color:var(--green);background:#e9fbf2;color:#167349}.digit.wrong,.carry.wrong{border-color:var(--danger);background:#fff0f0;color:#b92727;animation:shake .3s}.hint{height:30px;margin-top:8px;text-align:center;font-size:.8rem;font-weight:800;color:var(--muted)}.hint.error{color:var(--danger)}.hint.ok{color:var(--green)}.check{width:100%;border:0;border-radius:13px;padding:12px;margin-top:11px;color:#fff;font-weight:900;cursor:pointer;transition:.15s}.team-a .check{background:var(--a)}.team-a .check:hover{background:var(--a-dark)}.team-b .check{background:var(--b)}.team-b .check:hover{background:var(--b-dark)}.check:disabled{opacity:.6;cursor:not-allowed}.team-help{margin-top:12px;text-align:center;color:var(--muted);font-size:.75rem;font-weight:700}
.arena{padding:17px;display:flex;flex-direction:column;min-height:100%}.arena-title{text-align:center}.arena-title h2{margin:0;font-size:1.35rem;font-weight:900}.arena-title p{margin:5px 0 0;color:var(--muted);font-size:.82rem;font-weight:800}.match-info{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 7px;font-weight:900}.match-info .a-text{color:var(--a)}.match-info .b-text{color:var(--b)}.match-info .versus{font-size:.78rem;color:#9aa8b8;background:#f0f4f7;border-radius:999px;padding:5px 9px}.rope-zone{position:relative;min-height:292px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:20px;background:linear-gradient(#dff4ff 0 48%,#b8e19b 48% 100%);border:1px solid #cde7dd}.rope-zone:before{content:"";position:absolute;left:0;right:0;top:calc(100% - 110px);height:3px;background:#9bbd81}.cloud{position:absolute;font-size:3rem;opacity:.8}.cloud.one{left:9%;top:10%}.cloud.two{right:13%;top:20%;font-size:2.4rem}.ground{position:absolute;bottom:21px;left:11%;right:11%;height:12px;background:#7ea96b;border-radius:50%}.kid{position:absolute;bottom:25px;width:92px;height:140px;text-align:center;z-index:2}.kid-a{left:9%}.kid-b{right:9%}.kid .head{position:absolute;top:0;left:20px;width:53px;height:53px;border-radius:48% 52% 48% 52%;background:#ffd5ae;border:3px solid #8d5c49;z-index:2}.kid-a .head{background:#ffd0a1}.kid-b .head{background:#f6c295}.hair{position:absolute;left:17px;top:-8px;width:60px;height:28px;background:#583f35;border-radius:55% 55% 25% 25%;z-index:3}.kid-b .hair{background:#3c2c2b;border-radius:52% 52% 40% 40%;height:33px}.face{position:absolute;top:20px;left:14px;width:25px;font-size:16px;letter-spacing:5px}.kid-b .face{transform:scaleX(-1)}.body{position:absolute;top:50px;left:16px;width:62px;height:67px;border-radius:22px 22px 13px 13px;background:var(--a);border:3px solid #8d4a40}.kid-b .body{background:var(--b);border-color:#285da1}.leg{position:absolute;top:111px;width:14px;height:30px;background:#344459;border-radius:9px}.leg.l{left:26px;transform:rotate(10deg)}.leg.r{right:24px;transform:rotate(-10deg)}.arm{position:absolute;top:60px;width:52px;height:13px;background:#ffd0a1;border:3px solid #8d5c49;border-radius:15px;z-index:3}.kid-a .arm{right:-31px;transform:rotate(-18deg)}.kid-b .arm{left:-31px;transform:rotate(18deg)}.hand{position:absolute;top:55px;width:21px;height:21px;border-radius:50%;background:#ffd0a1;border:3px solid #8d5c49;z-index:5}.kid-a .hand{right:-43px}.kid-b .hand{left:-43px}.rope{position:absolute;left:18%;right:18%;top:calc(100% - 110px);height:13px;background:#b87333;border:3px solid #855023;border-radius:99px;transform:rotate(var(--rope-angle,0deg));transform-origin:center;z-index:1;transition:transform .4s ease,left .4s ease,right .4s ease}.rope:after{content:"🧣";position:absolute;left:50%;top:-18px;transform:translateX(-50%) rotate(90deg);font-size:27px}.flag{position:absolute;left:50%;top:calc(100% - 140px);height:31px;border-left:3px solid #8b5e3c;z-index:2;transition:left .4s ease}.flag:after{content:"⚑";position:absolute;left:-2px;top:-13px;color:#f4b942;font-size:23px}.arena-status{text-align:center;margin:12px 0 9px;padding:10px 12px;border-radius:13px;background:#f7f9fb;color:#65758a;font-weight:900;font-size:.84rem}.arena-status.win{background:#fff3c9;color:#9a6410}.legend{display:flex;justify-content:center;gap:13px;color:var(--muted);font-size:.74rem;font-weight:800}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}.legend .la{background:var(--a)}.legend .lb{background:var(--b)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pop{50%{transform:scale(1.08)}}.pop{animation:pop .35s ease}.modal{position:fixed;inset:0;background:#172337aa;display:none;place-items:center;z-index:10;padding:20px}.modal.show{display:grid}.modal-box{max-width:440px;background:#fff;border-radius:24px;padding:28px;text-align:center;box-shadow:0 20px 50px #17233755}.modal-box h2{margin:0 0 9px;font-size:1.8rem}.modal-box p{color:var(--muted);font-weight:700;line-height:1.7}.modal-box button{border:0;background:var(--gold);color:#513b09;padding:12px 22px;border-radius:12px;font-weight:900;cursor:pointer}
@media(max-width:1050px){.game-layout{grid-template-columns:1fr 1.15fr 1fr}.carry-row,.number-row,.answer-row{grid-template-columns:repeat(4,36px);gap:3px}.num,.operator,.digit{width:36px}.digit{height:43px}.problem-card{padding-left:6px;padding-right:6px}}
@media(max-width:760px){.app{padding:12px 10px 22px}.topbar{align-items:flex-start}.top-actions{flex-direction:column;align-items:flex-end}.pill{font-size:.75rem;padding:7px 10px}.brand-mark{width:48px;height:48px;font-size:27px}.brand p{font-size:.76rem}.game-layout{grid-template-columns:1fr;gap:12px}.arena{order:-1;min-height:390px}.team-card{min-height:470px}.rope-zone{min-height:245px}.kid-a{left:2%}.kid-b{right:2%}.rope{left:20%;right:20%}.flag{top:45%}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">✖️</div><div><h1>雙人乘法拔河賽</h1><p>算對一題，繩子就向你靠近一步！先完成 13 題的一組獲勝。</p></div></div>
    <div class="top-actions"><select class="level-select" id="levelSelect" aria-label="選擇關卡"><option value="1">第一關：兩位數 × 一位數</option><option value="2">第二關：三位數 × 一位數</option><option value="3">第三關：兩位數及三位數混合</option></select><div class="pill" id="levelPill">第一關　·　共 13 題</div><button class="restart" id="restartBtn">↻ 重新開始</button></div>
  </header>

  <main class="game-layout">
    <section class="team-card team-a" id="teamA">
      <div class="team-head"><div class="team-name"><i class="team-dot"></i>A 組</div><div class="score"><span id="scoreA">0</span><small id="targetA"> / 13 題</small></div></div>
      <div class="roundline"><span id="roundLabelA">第 1 題</span><span id="stateA">準備開始</span></div><div class="progress"><span id="progressA"></span></div>
      <div class="problem-card"><div class="problem-label"><span>A 組直式</span><span id="tagA">請由個位開始</span></div><div class="vertical" id="verticalA"></div><div class="hint" id="hintA">填好進位及答案後按檢查</div></div>
      <button class="check" id="checkA">檢查 A 組答案</button><div class="team-help">答錯的格子會變紅，必須改正後才能進入下一題。</div>
    </section>

    <section class="arena">
      <div class="arena-title"><h2>拔河競賽場</h2><p>兩組都在挑戰相同的 13 題乘法題</p></div>
      <div class="match-info"><span class="a-text">A 組 <b id="miniA">0</b></span><span class="versus">VS</span><span class="b-text">B 組 <b id="miniB">0</b></span></div>
      <div class="rope-zone" id="ropeZone"><div class="cloud one">☁️</div><div class="cloud two">☁️</div><div class="ground"></div><div class="kid kid-a" id="kid-a"><div class="hair"></div><div class="head"><div class="face">•ᴗ•</div></div><div class="body"></div><div class="arm"></div><div class="hand"></div><div class="leg l"></div><div class="leg r"></div></div><div class="kid kid-b" id="kid-b"><div class="hair"></div><div class="head"><div class="face">•ᴗ•</div></div><div class="body"></div><div class="arm"></div><div class="hand"></div><div class="leg l"></div><div class="leg r"></div></div><div class="rope" id="rope"></div><div class="flag" id="flag"></div></div>
      <div class="arena-status" id="arenaStatus">比賽開始！兩組請同時準備。</div><div class="legend"><span><i class="la"></i>A 組每答對一題</span><span><i class="lb"></i>B 組每答對一題</span></div>
    </section>

    <section class="team-card team-b" id="teamB">
      <div class="team-head"><div class="team-name"><i class="team-dot"></i>B 組</div><div class="score"><span id="scoreB">0</span><small id="targetB"> / 13 題</small></div></div>
      <div class="roundline"><span id="roundLabelB">第 1 題</span><span id="stateB">準備開始</span></div><div class="progress"><span id="progressB"></span></div>
      <div class="problem-card"><div class="problem-label"><span>B 組直式</span><span id="tagB">請由個位開始</span></div><div class="vertical" id="verticalB"></div><div class="hint" id="hintB">填好進位及答案後按檢查</div></div>
      <button class="check" id="checkB">檢查 B 組答案</button><div class="team-help">答錯的格子會變紅，必須改正後才能進入下一題。</div>
    </section>
  </main>
</div>
<div class="modal" id="winModal"><div class="modal-box"><div style="font-size:3rem" id="winIcon">🏆</div><h2 id="winTitle">比賽完成！</h2><p id="winText"></p><button id="modalRestart">再玩一次</button></div></div>
<script>
const TOTAL=13;
const LEVEL_NAMES={1:'第一關',2:'第二關',3:'第三關'};
let currentLevel=1;
let questions=[], teams={A:{index:0,goal:13,wrong:0,forward:0},B:{index:0,goal:13,wrong:0,forward:0}}, gameOver=false;
const $=id=>document.getElementById(id);
function makeQuestions(level){
  const shapes=level===1?Array(TOTAL).fill(2):level===2?Array(TOTAL).fill(3):[2,2,2,2,2,2,3,3,3,3,3,3,3];
  for(let i=shapes.length-1;i>0;i--){const j=rand(0,i);[shapes[i],shapes[j]]=[shapes[j],shapes[i]]}
  const list=shapes.map(digits=>{const n=digits===2?rand(24,89):rand(124,897);return makeProblem(n,rand(2,9))});
  while(list.length<40){const digits=currentLevel===1?2:currentLevel===2?3:(list.length%2?2:3);const n=digits===2?rand(24,89):rand(124,897);list.push(makeProblem(n,rand(2,9)))}
  return list;
}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function makeProblem(n,m){const s=String(n), ds=s.split('').map(Number), carries=Array(ds.length).fill(0), answer=[];let carry=0;for(let i=ds.length-1;i>=0;i--){const p=ds[i]*m+carry;answer.push(p%10);carry=Math.floor(p/10);if(i>0)carries[i]=carry} if(carry>0)answer.push(carry);return{n,m,answer,carries,answerLen:String(n*m).length}}
function fieldsFor(p){const ids=[];for(let i=0;i<p.answerLen;i++){ids.push('ans-'+i);if(i+1<p.answer.length&&i+1<p.n.toString().length)ids.push('carry-'+(i+1))}return ids}
function renderTeam(side){const t=teams[side],p=questions[t.index],root=$("vertical"+side);root.innerHTML='';const n=String(p.n), cols=Math.max(4,n.length+1,p.answerLen);const row=cls=>{const e=document.createElement('div');e.className=cls;e.style.gridTemplateColumns=`repeat(${cols},42px)`;return e};
  const makeChoice=(className,id,expected,kind)=>{const select=document.createElement('select');select.className=className;select.dataset.expected=expected;select.dataset.kind=kind;select.id=id;const blank=document.createElement('option');blank.value='';blank.textContent='－';select.append(blank);for(let digit=0;digit<=9;digit++){const option=document.createElement('option');option.value=String(digit);option.textContent=String(digit);select.append(option)}return select};
  const carry=row('carry-row'); for(let c=0;c<cols;c++){const right=cols-1-c;const e=document.createElement('div'); if(right>0&&right<n.length){e.append(makeChoice('carry',`${side}-carry-${right}`,p.carries[n.length-right],'carry'))} carry.append(e)}
  const top=row('number-row');for(let c=0;c<cols;c++){const e=document.createElement('div');const right=cols-1-c;if(right<n.length){e.className='num';e.textContent=n[n.length-1-right]}top.append(e)}root.append(top);
  const mid=row('number-row');for(let c=0;c<cols;c++){const e=document.createElement('div');const right=cols-1-c;if(right===n.length){e.className='operator';e.textContent='×'}else if(right===0){e.className='num';e.textContent=p.m}mid.append(e)}root.append(mid);
  const lineWrap=document.createElement('div');lineWrap.className='line-wrap';lineWrap.style.width=`${cols*42+(cols-1)*4}px`;const bar=document.createElement('div');bar.className='bar';bar.style.width='100%';lineWrap.append(bar);lineWrap.append(carry);root.append(lineWrap);
  const ans=row('answer-row');for(let c=0;c<cols;c++){const e=document.createElement('div');const right=cols-1-c;if(right<p.answerLen){e.append(makeChoice('digit',`${side}-ans-${right}`,p.answer[right],'answer'))}ans.append(e)}root.append(ans);
  root.querySelectorAll('select').forEach(select=>{select.addEventListener('change',()=>{select.classList.remove('wrong','correct')});select.addEventListener('keydown',e=>{if(e.key==='Enter')check(side)})});
  $("roundLabel"+side).textContent=t.index<TOTAL?`第 ${t.index+1} 題`:'完成 13 題';$("state"+side).textContent=t.index<TOTAL?'作答中':'已完成';$("score"+side).textContent=t.index;$("mini"+side).textContent=t.index;$("target"+side).textContent=` / ${t.goal} 題`;$("progress"+side).style.width=`${Math.min(100,t.index/t.goal*100)}%`;$("hint"+side).textContent='填好進位及答案後按檢查';$("hint"+side).className='hint';$("tag"+side).textContent=`${n} × ${p.m}`;
}
function check(side){if(gameOver)return;const t=teams[side],p=questions[t.index],inputs=$("vertical"+side).querySelectorAll('input');let all=true;inputs.forEach(input=>{const val=input.value.trim(), expected=String(input.dataset.expected);const ok=val===expected||(input.dataset.kind==='carry'&&expected==='0'&&val==='');input.classList.remove('wrong','correct');input.classList.add(ok?'correct':'wrong');if(!ok)all=false});if(!all){t.goal++;t.wrong++;$("target"+side).textContent=` / ${t.goal} 題`;$("hint"+side).textContent=`答錯了！${side==='A'?'B 組':'A 組'}向前一步，並增加 1 題；請改正本題。`;$("hint"+side).className='hint error';$("state"+side).textContent='需要改正（已加 1 題）';$("progress"+side).style.width=`${Math.min(100,t.index/t.goal*100)}%`;updateRope();return} t.index++;$("hint"+side).textContent=t.index>=t.goal?`太棒了！完成 ${t.goal} 題！`:'答對了！進入下一題';$("hint"+side).className='hint ok';$("state"+side).textContent=t.index>=t.goal?'已完成':'前進一步';updateRope(side);setTimeout(()=>{if(!gameOver&&t.index<t.goal)renderTeam(side)},500);if(t.index>=t.goal)finish(side)}
function updateRope(correctSide){const diff=teams.A.index-teams.B.index;const flag=50+diff*3.4;$("flag").style.left=`${Math.max(17,Math.min(83,flag))}%`;$("rope").style.setProperty('--rope-angle',`${-diff*1.2}deg`);if(correctSide==='A'){teams.B.forward++;$("kid-b").style.transform=`translateX(${-Math.min(48,teams.B.forward*10)}px)`}if(correctSide==='B'){teams.A.forward++;$("kid-a").style.transform=`translateX(${Math.min(48,teams.A.forward*10)}px)`}$("arenaStatus").textContent=correctSide?`${correctSide} 組答對！${correctSide==='A'?'B 組':'A 組'}向前一步。`:diff===0?'目前勢均力敵！':diff>0?`A 組領先 ${diff} 題`:`B 組領先 ${Math.abs(diff)} 題`}
function finish(side){if(teams[side].index<teams[side].goal)return;gameOver=true;const name=side==='A'?'A 組':'B 組';$("arenaStatus").textContent=`${name} 率先完成 13 題，拔河勝利！`;$("arenaStatus").classList.add('win');$("winIcon").textContent=side==='A'?'🏆':'🎉';$("winTitle").textContent=`${name} 獲勝！`;$("winText").textContent=`恭喜！${name} 最快完成所需的 ${teams[side].goal} 題，成為今天的乘法拔河冠軍。`;setTimeout(()=>$("winModal").classList.add('show'),350)}
function start(level=currentLevel){currentLevel=Number(level);questions=makeQuestions(currentLevel);teams={A:{index:0,goal:13,wrong:0,forward:0},B:{index:0,goal:13,wrong:0,forward:0}};gameOver=false;$("winModal").classList.remove('show');$("arenaStatus").className='arena-status';$("arenaStatus").textContent='比賽開始！兩組請同時準備。';$("levelSelect").value=String(currentLevel);$("levelPill").textContent=LEVEL_NAMES[currentLevel]+'　·　共 13 題';renderTeam('A');renderTeam('B');$("kid-a").style.transform='translateX(0)';$("kid-b").style.transform='translateX(0)';updateRope();setTimeout(()=>$("A-ans-0")?.focus(),80)}
$("checkA").addEventListener('click',()=>check('A'));$("checkB").addEventListener('click',()=>check('B'));$("restartBtn").addEventListener('click',()=>start(currentLevel));$("levelSelect").addEventListener('change',e=>start(e.target.value));$("modalRestart").addEventListener('click',()=>start(currentLevel));start();
</script>
</body>
